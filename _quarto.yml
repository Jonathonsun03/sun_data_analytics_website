project:
  type: website
  resources:
    - assets/data/creator_report_terms_definitions.json
    - assets/data/ENA_sample/*
  render:
    - index.qmd
    - pages/services.qmd
    - pages/portfolio/data-collection.qmd
    - pages/services/automated-reporting.qmd
    - pages/services/unified-methods.qmd
    - pages/services/archive/custom-reports.qmd
    - pages/portfolio/automated_reporting/[0-9][0-9]_*.qmd
    - pages/portfolio/side_projects/[0-9][0-9]_*.qmd
    - pages/portfolio.qmd
    - pages/insights.qmd
    - pages/insights/0[1-9]_*.qmd
    - pages/insights/[1-9][0-9]_*.qmd
    - pages/insights/[1-9][0-9][0-9]_*.qmd
    - pages/tools-data.qmd
    - pages/about.qmd

website:
  title: "Sun Data Analytics"
  favicon: assets/logos/sda-mark.svg
  navbar:
    background: white
    pinned: false
    search: false
    logo: assets/logos/sda-mark.svg
    logo-alt: "Sun Data Analytics mark"
    title: "Sun Data Analytics"
    left:
      - text: "Services"
        menu:
          - text: "Services Overview"
            href: pages/services.qmd
          - text: "Data Collection"
            href: pages/portfolio/data-collection.qmd
          - text: "Automated Reporting Systems"
            href: pages/services/automated-reporting.qmd
          - text: "Unified Methods"
            href: pages/services/unified-methods.qmd
      - text: "Portfolio"
        href: pages/portfolio.qmd
      - text: "Insights"
        href: pages/insights.qmd
      - text: "Tools & Reports"
        href: pages/tools-data.qmd
      - text: "About"
        href: pages/about.qmd
    right:
      - icon: github
        href: https://github.com/Jonathonsun03
        aria-label: "GitHub"
      - text: "Contact"
        href: mailto:jonathon@sun-dataanalytics.com
format:
  html:
    theme: cosmo
    css: css/styles.css
    include-after-body: site-parts/footer.html
    toc: false
